name: Check links

# Weekly, and on demand: every outside link in the guides and the county and
# city cards, so moved pages get fixed. Prints the broken ones in the run summary.
# (The nightly refresh also runs this check on Mondays and files an issue.)
on:
  schedule:
    - cron: "41 15 * * 1"   # Mondays, about 8:41 or 9:41 a.m. Mountain
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Check every outside link
        working-directory: pipeline
        shell: bash
        run: |
          python -c "import checks; print('\n'.join(checks.links(checks.site_links())) or 'no broken links')" | tee "$GITHUB_STEP_SUMMARY"
