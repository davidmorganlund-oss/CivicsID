name: Refresh and publish

on:
  schedule:
    - cron: "17 11 * * *"   # nightly, about 3:17 or 4:17 a.m. Pacific
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ["site/data/**", "README.md"]

# Each job gets only what it needs (below); nothing by default.
permissions: {}

concurrency:
  group: refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write   # save the refreshed data
      issues: write     # open and close the upkeep issues
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: true   # needed to push the refreshed data
          ref: main   # the latest main, not the commit that triggered a queued run
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m pytest -q tests
      - name: Build the calendar data
        shell: bash   # with pipefail, so a crash shows up instead of hiding behind tee
        run: python pipeline/build.py | tee "$GITHUB_STEP_SUMMARY"
      - name: Build the representatives roster
        shell: bash   # with pipefail, so a crash shows up instead of hiding behind tee
        run: python pipeline/officials.py | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Flag calendars that keep failing or stay quiet
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python pipeline/alerts.py
      - name: Save the refreshed data
        if: always()
        run: |
          git config user.name "civicsid-bot"
          git config user.email "civicsid-bot@users.noreply.github.com"
          git add site/data
          git diff --cached --quiet || git commit -m "Refresh calendar data"
          # If another run saved data meanwhile, keep this run's fresher data.
          git pull --rebase -X theirs origin main
          git push
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site

  publish:
    needs: refresh
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
