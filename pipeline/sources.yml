  # Coeur d'Alene posts no feed. The council's regular schedule and its 2026
  # date list are on the city's site; the agenda packet is linked to each
  # meeting once the city posts it.
  - id: coeur-dalene
    name: City of Coeur d'Alene
    type: schedule
    county: Kootenai
    area: Coeur d'Alene
    timezone: America/Los_Angeles
    homepage: https://www.cdaid.org/government/mayor-and-council/council-meeting-schedule/
    meetings:
      - title: City Council Meeting
        when: 1st, 3rd Tuesday
        until: 2026-12-15       # the last date on the city's published 2026 schedule
        time: "18:00"
        location: Coeur d'Alene Public Library Community Room
        category: council
        url: https://www.cdaid.org/government/mayor-and-council/council-meeting-schedule/
        agenda_page: https://www.cdaid.org/government/mayor-and-council/council-agendas/

  # Other city boards that meet at the Coeur d'Alene library, from the
  # library's "City Meetings at the Library" calendar. Council meetings are
  # left to the source above, which carries the agenda link.
  - id: coeur-dalene-boards
    name: City of Coeur d'Alene
    type: libcal
    host: cdalibrary.libcal.com
    calendar: 21178
    only_categories: [City Meeting]
    skip_titles: ^city council meeting|preparation|executive session|meet and greet|foundation
    default_category: council
    default_location: Coeur d'Alene Public Library
    county: Kootenai
    area: Coeur d'Alene
    timezone: America/Los_Angeles
    homepage: https://www.cdaid.org/government/departments/municipal-services/meeting-agendas/

