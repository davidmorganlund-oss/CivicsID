  # Rathdrum's site has no feed and turns away automated readers, so these
  # are entered by hand from the pages the city publishes. Update each January
  # when the city posts the new year's council schedule.
  - id: rathdrum
    name: City of Rathdrum
    type: schedule
    county: Kootenai
    area: Rathdrum
    timezone: America/Los_Angeles
    homepage: https://www.rathdrum.gov/1114/2026-council-meeting-schedule
    meetings:
      # The city calendar lists the November meeting on Wed. Nov. 11; the
      # schedule page lists no meeting Nov. 25 or Dec. 23.
      - title: City Council Meeting
        dates: [2026-11-11, 2026-12-09]
        time: "17:30"
        location: Rathdrum City Hall, 8047 W. Main Street
        category: council
        url: https://www.rathdrum.gov/calendar
      # From 2027: "2nd and 4th Wednesday of each month, with the exception of
      # November and December."
      - title: City Council Meeting
        when: 2nd, 4th Wednesday
        skip_months: [11, 12]
        time: "17:30"
        location: Rathdrum City Hall, 8047 W. Main Street
        category: council
        url: https://www.rathdrum.gov/1114/2026-council-meeting-schedule
      - title: Public Input Session with Planning & Zoning Commissioners
        dates: [2026-11-18]
        one_off: true
        time: "17:30"
        location: Rathdrum City Hall, 8047 W. Main Street
        category: council
        url: https://www.rathdrum.gov/calendar
      - title: Planning & Zoning Commission Meeting
        dates: [2026-11-18, 2026-12-16]
        time: "17:30"
        location: Rathdrum City Hall, 8047 W. Main Street
        category: council
        url: https://www.rathdrum.gov/66/planning-and-zoning-commission
      - title: Parks & Recreation Commission
        when: 4th Tuesday
        skip_months: [1, 3, 4, 6, 7, 9, 10, 12]   # meets in February, May, August and November
        time: "18:00"
        location: Rathdrum City Hall, 8047 W. Main Street
        category: council
        url: https://www.rathdrum.gov/450/parks-and-recreation-commission

  # Dalton Gardens' calendar has no feed and its site asks automated readers
  # to stay out of the address the calendar loads from, so these are entered
  # by hand from the city's calendar page. Check that page and update monthly.
  - id: dalton-gardens
    name: City of Dalton Gardens
    type: schedule
    county: Kootenai
    area: Dalton Gardens
    timezone: America/Los_Angeles
    homepage: https://daltongardens.com/index.asp?SEC=AC5941C2-9903-404E-8FF3-B027D3CC1EB6
    # Posted dates come from the city's calendar page; after those run out, the
    # regular schedules the city publishes on each board's own page take over.
    meetings:
      - title: Regular City Council Meeting
        dates: [2026-11-18, 2026-12-30]
        time: "18:00"
        end: "19:30"
        category: council
        url: https://daltongardens.com/citycouncil
      # "typically held the last Wednesday of each month at 6pm, meetings in
      # November and December may differ due to the holidays"
      - title: Regular City Council Meeting
        when: last Wednesday
        from: 2027-01-01
        skip_months: [11, 12]
        time: "18:00"
        end: "19:30"
        category: council
        url: https://daltongardens.com/citycouncil
      - title: Planning and Zoning Meeting
        dates: [2026-12-03]
        time: "18:00"
        end: "19:00"
        category: council
        url: https://daltongardens.com/planning
      # "typically held the first Thursday of each month at 6pm. January and
      # July meetings may differ due to the holidays"
      - title: Planning and Zoning Meeting
        when: 1st Thursday
        from: 2027-01-01
        skip_months: [1, 7]
        time: "18:00"
        end: "19:00"
        category: council
        url: https://daltongardens.com/planning
      - title: Dalton Water Board Meeting
        dates: [2026-11-11, 2026-12-09]
        time: "17:00"
        end: "18:00"
        category: council
        url: https://daltongardens.com/index.asp?SEC=97ED42C6-7FEC-4515-B380-2841CCB2B704
      # Dalton Water Association: "Regular board meetings are held at 5pm on the
      # 2nd Wednesday of each month in the Council Room at Dalton Gardens' City Hall"
      - title: Dalton Water Board Meeting
        when: 2nd Wednesday
        from: 2027-01-01
        time: "17:00"
        end: "18:00"
        location: Dalton Gardens City Hall, 6360 N 4th St
        category: council
        url: https://daltongardens.com/index.asp?SEC=97ED42C6-7FEC-4515-B380-2841CCB2B704
      - title: Dalton Irrigation Board Meeting
        dates: [2026-12-14]
        time: "18:00"
        end: "19:00"
        category: council
        url: https://daltongardens.com/irrigation
      # Dalton Gardens Irrigation District: "Meetings are held at 6:00 PM on the
      # second Monday of each month at the DGID office" (inside City Hall)
      - title: Dalton Irrigation Board Meeting
        when: 2nd Monday
        from: 2027-01-01
        time: "18:00"
        end: "19:00"
        location: Dalton Gardens Irrigation District office, Dalton Gardens City Hall
        category: council
        url: https://daltongardens.com/irrigation

